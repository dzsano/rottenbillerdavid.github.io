<head>

<style>
body {
  margin: 0;
  font-family: "Georgia", serif;
  background: #000;
  color: #e0e0e0;
  transition: background-color 1s ease, color 1s ease;
}

/* Navbar same as homepage */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: #000;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2rem;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}
nav a {
  text-decoration: none;
  color: inherit;
  font-weight: bold;
  padding: 0.5rem 1rem;
  border: 2px solid currentColor;
  border-radius: 8px;
  margin-left: 0.8rem;
  font-size: 1rem;
  transition: background 0.4s ease, color 0.4s ease;
}
nav a:hover {
  background: currentColor;
  color: #000;
}
nav .brand {
  font-weight: bold;
  font-size: 1.1rem;
  border: 2px solid currentColor;
  padding: 0.4rem 0.8rem;
  border-radius: 8px;
}

main {
  margin-top: 100px;
  padding: 2rem;
  text-align: center;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}
a.back-home {
  display: inline-block;
  margin-top: 2rem;
  font-weight: bold;
  color: inherit;
  text-decoration: none;
  border: 2px solid currentColor;
  border-radius: 8px;
  padding: 0.5rem 1rem;
  transition: background 0.4s ease, color 0.4s ease;
}
a.back-home:hover {
  background: currentColor;
  color: #000;
}
