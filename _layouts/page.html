<!DOCTYPE html>

<title>{{ page.title }} | {{ site.title }}</title>
<style>
body {
  font-family: "Georgia", serif;
  margin: 0;
  background: #fff;
  color: #000;
  padding-top: 80px;
  text-align: center;
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 60px;
  background: #fff;
  color: #000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2rem;
  border-bottom: 2px solid #000;
  z-index: 10;
}

nav .brand {
  font-weight: bold;
  font-size: 1.1rem;
  transform: scale(1.1);
  transform-origin: left center;
  text-decoration: none;
  color: inherit;
  padding: 8px 14px;
  border-radius: 4px;
  transition: all 0.3s ease;
}

nav .brand:hover {
  background: #000;
  color: #fff;
}

.nav-links {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 1rem;
}

.nav-links a {
  color: inherit;
  text-decoration: none;
  font-weight: bold;
  font-size: 0.95rem;
  padding: 8px 14px;
  border-radius: 4px;
  transition: all 0.3s ease;
}

.nav-links a:hover {
  background: #000;
  color: #fff;
  border-radius: 4px;
}

/* MAIN CONTENT */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem;
  text-align: left;
}
</style>
</head>
<body>

<!-- NAVBAR -->
