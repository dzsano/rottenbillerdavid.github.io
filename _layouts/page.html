<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | {{ site.title }}</title>

<style>
body {
  font-family: "Georgia", serif;
  margin: 0;
  background: #fff;
  color: #000;
  padding-top: 80px;
  line-height: 1.6;
  text-align: center;
}

/* ----------- NAVBAR (IDENTICAL TO HOMEPAGE) ----------- */
nav {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 60px;
  background: #fff;
  color: #000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2.5rem;
  border-bottom: 2px solid #000;
  z-index: 10;
}

nav .brand {
  font-weight: bold;
  font-size: 1.25rem;
  transform: scale(1.25);
  transform-origin: left center;
  text-decoration: none;
  color: inherit;
  padding: 8px 14px;
  border-radius: 4px;
  transition: all 0.3s ease;
}

nav .brand:hover {
  background: #000;
  color: #fff;
}

.nav-links {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 1rem;
  flex-grow: 1;
  margin-left: 2rem;
  padding-right: calc(1.5rem + 38px);
  box-sizing: border-box;
}

.nav-links a {
  color: inherit;
  text-decoration: none;
  font-weight: bold;
  font-size: 0.95rem;
  padding: 8px 14px;
  border-radius: 4px;
  transition: all 0.3s ease;
}

.nav-links a:hover {
  background: #000;
  color: #fff;
}

nav a:focus { outline: none !important; }

/* -------- CONTENT -------- */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem;
  text-align: left;
}
main img {
  display: block;
  max-width: 700px;
  width: 90%;
  margin: 2rem auto;
  border-radius: 10px;
}
</style>
</head>

<body>

<nav>
  <a href="/index.html" class="brand">HillierLab</a>
  <div class="nav-links">
    <a href="/vision.html">Vision</a>
    <a href="/research.html">Research</a>
    <a href="/patients-teachers-students.html">Patients, Teachers, Students</a>
    <a href="/team.html">Team</a>
    <a href="/collaborations.html">Collaborations</a>
    <a href="/news-publications.html">News & Publications</a>
    <a href="/contact.html">Contact</a>
  </div>
</nav>

<main>
  <h1>{{ page.title }}</h1>
  {{ content }}
</main>

</body>
</html>
