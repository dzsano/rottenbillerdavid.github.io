<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      color: #000;
      background-color: #fff;
      padding: 2rem;
      line-height: 1.6;
      text-align: center;
    }

    header {
      margin-bottom: 2rem;
    }

    header a {
      color: #000;
      text-decoration: none;
      border: 1px solid #000;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
    }

    header a:hover {
      background: #000;
      color: #fff;
    }

    img {
      max-width: 600px;
      width: 80%;
      height: auto;
      margin-top: 2rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Back to Home</a>
  </header>

  <h1>{{ page.title }}</h1>

  <main>
    {{ content }}
  </main>
</body>
</html>
