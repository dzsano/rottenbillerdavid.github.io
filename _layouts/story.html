<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }} | {{ site.title }}</title>

<style>
body {
  margin: 0;
  font-family: "Georgia", serif;
  background: #fff;
  color: #000;
  padding-top: 80px;
  line-height: 1.6;
}

/* NAVBAR (same as index + page layout) */
nav {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 60px;
  background: #fff;
  border-bottom: 2px solid #000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2.5rem;
  z-index: 10;
}
nav .brand {
  font-weight: bold;
  font-size: 1.25rem;
  transform: scale(1.25);
  transform-origin: left center;
  padding: 8px 14px;
  border-radius: 4px;
  color: inherit;
  text-decoration: none;
  transition: 0.3s;
}
nav .brand:hover { background:#000; color:#fff; }

.nav-links {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-grow: 1;
  margin-left: 2rem;
  padding-right: calc(1.5rem + 38px);
}
.nav-links a {
  font-weight: bold;
  color: inherit;
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 4px;
  transition: 0.3s;
}
.nav-links a:hover { background:#000; color:#fff; }

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem;
  text-align: left;
}

main img {
  display: block;
  width: 100%;
  max-width: 900px;
  margin: 2rem auto;
  border-radius: 12px;
}
</style>

</head>
<body>

<nav>
  <a href="/index.html" class="brand">HillierLab</a>
  <div class="nav-links">
    <a href="/vision.html">Vision</a>
    <a href="/research.html">Research</a>
    <a href="/patients-teachers-students.html">Patients, Teachers, Students</a>
    <a href="/team.html">Team</a>
    <a href="/collaborations.html">Collaborations</a>
    <a href="/news-publications.html">News & Publications</a>
    <a href="/contact.html">Contact</a>
  </div>
</nav>

<main>
  <h1>{{ page.title }}</h1>
  {{ content }}
</main>

</body>
</html>
