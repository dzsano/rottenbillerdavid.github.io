<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | {{ site.title }}</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: "Georgia", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: #000;
  color: #e0e0e0;
  transition: background-color 1.5s ease, color 1.5s ease;
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0; 
  left: 0;
  width: 100%;
  height: 60px;
  background: #000;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2.5rem;
  z-index: 10;
  border-bottom: 2px solid #fff;
  transition: background-color 1.2s ease, color 1.2s ease, border-color 1.2s ease;
}

nav .brand {
  font-weight: bold;
  font-size: 1.25rem;
  transform: scale(1.25);
  transform-origin: left center;
  text-decoration: none;
  color: inherit;
  padding: 8px 14px;
  border-radius: 4px;
  transition: all 0.3s ease;
}

nav .brand:hover {
  background: #fff;
  color: #000;
}

.nav-links {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 1rem;
  flex-grow: 1;
  margin-left: 2rem;
  padding-right: calc(1.5rem + 38px);
  box-sizing: border-box;
}

.nav-links a {
  color: inherit;
  text-decoration: none;
  font-weight: bold;
  font-size: 0.95rem;
  padding: 8px 14px;
  border-radius: 4px;
  transition: all 0.3s ease;
}

.nav-links a:hover {
  background: #fff;
  color: #000;
}

nav a:focus { outline: none !important; }

/* SCENE */
.scene {
  position: relative;
  flex-grow: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 60px;
}

.silhouette {
  position: absolute;
  left: 4%;
  top: 20%;
  width: 35vw;
  max-width: 800px;
  z-index: 1;
}
.silhouette img { position: absolute; width: 100%; transition: opacity 1.2s ease; }
.silhouette img.happy { opacity: 0; }
body.happy .silhouette img.gloomy { opacity: 0; }
body.happy .silhouette img.happy { opacity: 1; }

.projection {
  position: absolute;
  right: 7%;
  top: 25%;
  width: 30vw;
  max-width: 800px;
  transition: opacity 1.2s ease;
}
.projection.happy { opacity: 0; }

.brain {
  position: absolute;
  top: 10%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60vw;
  max-width: 840px;
  z-index: 2;
}
.brain img { position: absolute; width: 100%; transition: opacity 1.2s ease; }
.brain img.happy { opacity: 0; z-index: 2; }

.lock {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 40%;
  opacity: 0;
  transition: opacity 0.6s ease;
  cursor: url('/assets/images/big_key2.png') 16 16, pointer;
  z-index: 3;
}
.scene:hover .lock { opacity: 1; }

.subtitle {
  position: absolute;
  top: 68%;
  width: 100%;
  text-align: center;
  font-size: 1.2rem;
  transition: color 1s ease;
}

/* CORNER LINKS */
.corner-links { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; }
.corner-links a { position: absolute; opacity: 0; transition: opacity 0.8s ease; }

/* HAPPY STATE */
body.happy {
  background: #fff;
  color: #000;
}
body.happy nav { background: #fff; color: #000; border-bottom: 2px solid #000; }
body.happy nav a:hover { background: #000; color: #fff; }
body.happy .projection.gloomy, body.happy .brain img.gloomy { opacity: 0; }
body.happy .projection.happy, body.happy .brain img.happy { opacity: 1; }
body.happy .subtitle { color: #000; }
body.happy .lock { display: none; }

</style>
</head>

<body>

<nav>
  <a href="/index.html" class="brand">HillierLab</a>
  <div class="nav-links">
    <a href="/vision.html">Vision</a>
    <a href="/research.html">Research</a>
    <a href="/patients-teachers-students.html">Patients, Teachers, Students</a>
    <a href="/team.html">Team</a>
    <a href="/collaborations.html">Collaborations</a>
    <a href="/news-publications.html">News & Publications</a>
    <a href="/contact.html">Contact</a>
  </div>
</nav>

<div class="scene">
  <div class="silhouette">
    <img src="/assets/images/gloomy_window.png" class="gloomy">
    <img src="/assets/images/happy_window.png" class="happy">
  </div>

  <div class="brain" id="brain">
    <img src="/assets/images/g_brain.png" class="gloomy">
    <img src="/assets/images/h_brain.png" class="happy">
  </div>

  <img src="/assets/images/lock_blue.png" class="lock" id="lock">

  <img src="/assets/images/gloomy_scenery.png" class="projection gloomy">
  <img src="/assets/images/happy_scenery.png" class="projection happy">

  <div class="subtitle" id="subtitle">
    Unlocking the Mesoscale Level of the Brain
  </div>
</div>

<div class="corner-links" id="corner-links">
  <a class="corner-top-left" href="/biotechnology">BIOTECHNOLOGY</a>
  <a class="corner-top-right" href="/animal_models">ANIMAL MODELS</a>
  <a class="corner-bottom-left" href="/healing">HEALING</a>
  <a class="corner-bottom-right" href="/streamlined">STREAMLINED</a>
</div>

<script>
const body = document.body;
const lock = document.getElementById('lock');
const subtitle = document.getElementById('subtitle');
const cornerLinks = document.getElementById('corner-links');
const cornerAnchors = cornerLinks.querySelectorAll('a');

/* ✅ Apply saved state on load */
if (localStorage.getItem("happyMode") === "true") {
  body.classList.add('happy');
  lock.style.display = 'none';
  cornerLinks.style.pointerEvents = 'auto';
  cornerLinks.style.opacity = '1';
  cornerAnchors.forEach(a => a.style.opacity = '1');
  subtitle.textContent = 'Bridging the Gap Between Molecules and Behavior';
}

/* ✅ Save state when unlocking */
lock.addEventListener('click', e => {
  e.stopPropagation();
  if (localStorage.getItem("happyMode") === "true") return;

  localStorage.setItem("happyMode", "true");
  body.classList.add('happy');

  lock.style.opacity = '0';
  setTimeout(() => lock.style.display = 'none', 800);

  setTimeout(() => {
    cornerLinks.style.pointerEvents = 'auto';
    cornerLinks.style.opacity = '1';
    cornerAnchors.forEach((a, i) => setTimeout(() => a.style.opacity = '1', i * 500));
  }, 800);

  subtitle.textContent = 'Bridging the Gap Between Molecules and Behavior';
});
</script>

</body>
</html>
