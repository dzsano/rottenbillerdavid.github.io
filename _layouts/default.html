<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | {{ site.title }}</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: "Georgia", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: #000;
  color: #e0e0e0;
  transition: background-color 1.5s ease, color 1.5s ease;
}

/* ----------- NAVBAR ----------- */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: #000;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2rem;
  z-index: 10;
  transition: background-color 1.2s ease, color 1.2s ease;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

nav a {
  text-decoration: none;
  color: inherit;
  font-weight: bold;
  padding: 0.5rem 1rem;
  border: 2px solid currentColor;
  border-radius: 8px;
  margin-left: 0.8rem;
  font-size: 1rem;
  transition: background 0.4s ease, color 0.4s ease;
}
nav a:hover {
  background: currentColor;
  color: #000;
}
nav .brand {
  font-weight: bold;
  font-size: 1.1rem;
  border: 2px solid currentColor;
  padding: 0.4rem 0.8rem;
  border-radius: 8px;
}

/* ----------- SCENE ----------- */
.scene {
  position: relative;
  flex-grow: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 60px;
}

.silhouette {
  position: absolute;
  left: 8%;
  top: 20%;
  width: 35vw;
  max-width: 800px;
  z-index: 1;
}

.projection {
  position: absolute;
  right: 10%;
  top: 20%;
  width: 35vw;
  max-width: 800px;
  transition: opacity 1.2s ease;
  z-index: 1;
  opacity: 1;
}
.projection.happy { opacity: 0; }

.brain {
  position: absolute;
  top: 10%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 50vw;
  max-width: 700px;
  z-index: 2;
}
.brain img {
  width: 100%;
  height: auto;
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  transition: opacity 1.2s ease;
}
.brain img.happy { opacity: 0; z-index: 2; }
.brain img.gloomy { z-index: 1; }

.lock {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 30%;
  opacity: 0;
  transition: opacity 0.6s ease;
  cursor: url('/assets/images/key-cursor.png') 16 16, pointer;
  z-index: 3;
}
.scene:hover .lock { opacity: 1; }

.subtitle {
  position: absolute;
  top: 68%;
  width: 100%;
  text-align: center;
  font-size: 1.2rem;
  color: #e0e0e0;
  transition: color 1s ease;
}

/* ----------- CORNER LINKS ----------- */
.corner-links {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s ease;
}
.corner-links a {
  position: absolute;
  font-size: 1.4rem;
  font-weight: bold;
  text-decoration: none;
  color: inherit;
  pointer-events: auto;
  transition: color 0.6s ease;
}
.corner-top-left { top: 30px; left: 30px; }
.corner-top-right { top: 30px; right: 30px; }
.corner-bottom-left { bottom: 30px; left: 30px; }
.corner-bottom-right { bottom: 30px; right: 30px; }

/* ----------- HAPPY MODE ----------- */
body.happy {
  background: #fff;
  color: #000;
}
body.happy nav {
  background: #fff;
  color: #000;
}
body.happy nav a:hover {
  background: #000;
  color: #fff;
}
body.happy .projection.gloomy,
body.happy .brain img.gloomy { opacity: 0; }
body.happy .projection.happy,
body.happy .brain img.happy { opacity: 1; }
body.happy .subtitle { color: #000; }
body.happy .lock { display: none; }
body.happy .corner-links { opacity: 1; }
</style>
</head>
<body>

<!-- Navbar -->
<nav>
  <a href="/index.html" class="brand">HillierLab@HUN-REN TTK + PPKE-IT</a>
  <div>
    <a href="/vision.html">Vision</a>
    <a href="/research.html">Research</a>
    <a href="/patients.html">Patients, Teachers, Students</a>
    <a href="/team.html">Team</a>
    <a href="/collaborations.html">Collaborations</a>
    <a href="/news.html">News & Publications</a>
    <a href="/contact.html">Contact</a>
  </div>
</nav>

<!-- Scene -->
<div class="scene">
  <img src="/assets/images/big_human.png" class="silhouette" alt="Human silhouette">

  <div class="brain" id="brain">
    <img src="/assets/images/g_brain.png" class="gloomy" alt="Gloomy brain">
    <img src="/assets/images/h_brain.png" class="happy" alt="Happy brain">
  </div>

  <img src="/assets/images/big_lock.png" class="lock" id="lock" alt="Lock">
  <img src="/assets/images/big_scary.png" class="projection gloomy" alt="Scary projection">
  <img src="/assets/images/big_happy.png" class="projection happy" alt="Happy projection">

  <div class="subtitle" id="subtitle">
    Unlocking the Mesoscale Level of the Brain
  </div>

  <!-- Corner animal project links -->
  <div class="corner-links">
    <a href="/rat.html" class="corner-top-left">Rat Project</a>
    <a href="/cat.html" class="corner-top-right">Cat Project</a>
    <a href="/macaque.html" class="corner-bottom-left">Macaque Project</a>
    <a href="/human.html" class="corner-bottom-right">Human Project</a>
  </div>
</div>

<script>
const lock = document.getElementById('lock');
const body = document.body;
const subtitle = document.getElementById('subtitle');
const brainGloomy = document.querySelector('.brain img.gloomy');
const brainHappy = document.querySelector('.brain img.happy');
const projGloomy = document.querySelector('.projection.gloomy');
const projHappy = document.querySelector('.projection.happy');
const cornerLinks = document.querySelector('.corner-links');
let unlocked = false;

lock.addEventListener('click', e => {
  e.stopPropagation();
  if (unlocked) return;
  unlocked = true;

  body.classList.add('happy');

  lock.style.transition = 'opacity 0.8s ease';
  lock.style.opacity = '0';
  setTimeout(() => { lock.style.display = 'none'; }, 800);

  brainGloomy.style.opacity = '0';
  projGloomy.style.opacity = '0';
  setTimeout(() => {
    brainHappy.style.opacity = '1';
    projHappy.style.opacity = '1';
  }, 300);

  subtitle.textContent = 'Bridging the Gap Between Molecules and Behavior';
});
</script>
</body>
</html>
