<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      color: #e0e0e0;
      background-color: #000;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 1s ease;
    }

    .scene {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80vh;
      width: 100%;
    }

    /* Brain in the center */
    .brain {
      position: relative;
      width: 25%;
      max-width: 300px;
      cursor: url('/assets/images/key-cursor.png'), auto;
      transition: transform 0.3s ease;
      z-index: 2;
    }

    .brain:hover {
      transform: scale(1.05);
    }

    .brain img {
      width: 100%;
      height: auto;
      display: block;
      transition: opacity 0.6s ease;
    }

    /* Lock appears on hover */
    .lock {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      width: 40%;
    }

    .brain:hover .lock {
      opacity: 1;
    }

    /* Silhouette and projection */
    .silhouette {
      position: absolute;
      left: 10%;
      width: 25%;
      max-width: 250px;
      z-index: 1;
    }

    .projection {
      position: absolute;
      right: 10%;
      width: 30%;
      max-width: 300px;
      transition: opacity 1s ease;
    }

    /* Corner links */
    .corner-links {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .corner-links a {
      position: absolute;
      color: #fff;
      text-decoration: none;
      font-size: 1.2rem;
      pointer-events: auto;
      transition: color 0.3s;
    }

    .corner-links a:hover {
      color: #000;
    }

    .corner-top-left { top: 10px; left: 10px; }
    .corner-top-right { top: 10px; right: 10px; }
    .corner-bottom-left { bottom: 10px; left: 10px; }
    .corner-bottom-right { bottom: 10px; right: 10px; }

    /* Happy mode styles */
    body.happy {
      background-color: #fff;
      color: #000;
    }

    body.happy .corner-links {
      opacity: 1;
    }

    body.happy .projection,
    body.happy .brain img.gloomy {
      opacity: 0;
    }

    body.happy .projection.happy,
    body.happy .brain img.happy {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="scene">
    <img src="/assets/images/silhouette.png" class="silhouette" alt="Human silhouette">

    <div class="brain" id="brain">
      <img src="/assets/images/gloomy_brain.png" class="gloomy" alt="Gloomy Brain">
      <img src="/assets/images/happy_brain.png" class="happy" alt="Happy Brain" style="opacity:0;">
      <img src="/assets/images/lock.png" class="lock" alt="Lock Icon">
    </div>

    <img src="/assets/images/projection_scary.png" class="projection gloomy" alt="Scary Projection">
    <img src="/assets/images/projection_happy.png" class="projection happy" alt="Happy Projection" style="opacity:0;">

    <div class="corner-links">
      <a href="rat.html" class="corner-top-left">Rat Project</a>
      <a href="cat.html" class="corner-top-right">Cat Project</a>
      <a href="macaque.html" class="corner-bottom-left">Macaque Project</a>
      <a href="human.html" class="corner-bottom-right">Human Project</a>
    </div>
  </div>

  <script>
    const brain = document.getElementById('brain');
    const body = document.body;

    brain.addEventListener('click', () => {
      body.classList.toggle('happy');
    });
  </script>
</body>
</html>
