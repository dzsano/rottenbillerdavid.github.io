<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | {{ site.title }}</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: "Georgia", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: #000;
  color: #e0e0e0;
  transition: background-color 1.5s ease, color 1.5s ease;
}

/* ----------- NAVBAR ----------- */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: #000;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2.5rem;
  z-index: 10;
  border-bottom: 2px solid #fff;
}

nav .brand {
  font-weight: bold;
  font-size: 1.25rem;
  transform: scale(1.25);
  transform-origin: left center;
  text-decoration: none;
  color: inherit;
  padding: 8px 14px;
  border-radius: 4px;
  transition: all 0.3s ease;
}

nav .brand:hover {
  background: #fff;
  color: #000;
}

/* Navbar links container */
.nav-links {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 1rem;
  flex-grow: 1;
  margin-left: 2rem;
  padding-right: calc(1.5rem + 38px); /* consistent right spacing */
  box-sizing: border-box;
}

.nav-links a {
  color: inherit;
  text-decoration: none;
  font-weight: bold;
  font-size: 0.95rem;
  padding: 8px 14px;
  border-radius: 4px;
  transition: all 0.3s ease;
}

.nav-links a:hover {
  background: #fff;
  color: #000;
}

nav a:focus { outline: none !important; }

/* EVERYTHING BELOW THIS STAYS AS YOU LAST HAD IT */
.scene { ... }
.brain { ... }
.projection { ... }
.lock { ... }
.subtitle { ... }
.corner-links { ... }

/* ----------- HAPPY MODE ----------- */
body.happy { background:#fff;color:#000; }
body.happy nav { background:#fff;color:#000;border-bottom:2px solid #000; }
body.happy .nav-links a:hover,
body.happy .brand:hover { background:#000;color:#fff; }
</style>
</head>

<body>

<nav>
  <a href="/index.html" class="brand">HillierLab</a>
  <div class="nav-links">
    <a href="/vision.html">Vision</a>
    <a href="/research.html">Research</a>
    <a href="/patients-teachers-students.html">Patients, Teachers, Students</a>
    <a href="/team.html">Team</a>
    <a href="/collaborations.html">Collaborations</a>
    <a href="/news-publications.html">News & Publications</a>
    <a href="/contact.html">Contact</a>
  </div>
</nav>

<!-- Your scene elements stay unchanged -->

</body>
</html>
