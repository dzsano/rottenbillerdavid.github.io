<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      color: #000000;
      background-color: #ffffff;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    h1 {
      margin-bottom: 2rem;
    }

    .container {
      display: flex;
      width: 100%;
      height: 80vh;
      justify-content: space-around;
      align-items: center;
    }

    .image-half {
      position: relative;
      width: 40%;
      text-align: center;
    }

    .image-half img {
      width: 80%;
      max-width: 400px;
      height: auto;
      transition: opacity 0.5s ease;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Hide the alternate (happy) versions by default */
    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Hover effects */
    .house:hover .gloomy-house {
      opacity: 0;
    }
    .house:hover .happy-house {
      opacity: 1;
    }

    .brain:hover .gloomy-head {
      opacity: 0;
    }
    .brain:hover .happy-head {
      opacity: 1;
    }

    .links {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      z-index: 10;
    }

    .links a {
      color: #aaa;
      text-decoration: none;
      font-size: 1.3rem;
      transition: color 0.3s;
    }

    .links a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>{{ site.title }}</h1>
  <div class="container">
    <div class="image-half house">
      <img src="/assets/images/gloomy_house.png" alt="Gloomy House" class="gloomy-house">
      <img src="/assets/images/happy_house.png" alt="Happy House" class="happy-house hidden">
    </div>

    <div class="links">
      <a href="#">Rat Project</a>
      <a href="#">Cat Project</a>
      <a href="#">Macaque Project</a>
      <a href="#">Human Project</a>
    </div>

    <div class="image-half brain">
      <img src="/assets/images/gloomy_head.png" alt="Gloomy Head" class="gloomy-head">
      <img src="/assets/images/happy_head.png" alt="Happy Head" class="happy-head hidden">
    </div>
  </div>
</body>
</html>
