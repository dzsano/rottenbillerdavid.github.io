<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} | {{ site.title }}</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: "Georgia", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: #000;
  color: #e0e0e0;
  transition: background-color 1.5s ease, color 1.5s ease;
}

/* ----------- NAVBAR ----------- */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: #000;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2rem;
  z-index: 10;
  transition: background-color 1.2s ease, color 1.2s ease;
}
nav a {
  color: inherit;
  text-decoration: none;
  margin-left: 1.5rem;
  font-weight: bold;
  font-size: 1rem;
  transition: color 0.5s ease;
}
nav a:hover { text-decoration: underline; }
nav .brand { font-weight: bold; }

/* ----------- SCENE ----------- */
.scene {
  position: relative;
  flex-grow: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 60px; /* push scene below navbar */
}

/* Silhouette */
.silhouette {
  position: absolute;
  left: 8%;
  top: 20%;
  width: 35vw;
  max-width: 800px;
  z-index: 1;
}

/* Projection */
.projection {
  position: absolute;
  right: 10%;
  top: 20%;
  width: 35vw;
  max-width: 800px;
  transition: opacity 1.2s ease;
  z-index: 1;
  opacity: 1;
}
.projection.happy { opacity: 0; }

/* Brain under lock */
.brain {
  position: absolute;
  top: 10%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 50vw;
  max-width: 700px;
  z-index: 2;
}
.brain img {
  width: 100%;
  height: auto;
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  transition: opacity 1.2s ease;
}
.brain img.happy { opacity: 0; z-index: 2; }
.brain img.gloomy { z-index: 1; }

/* Lock on top */
.lock {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 30%;
  opacity: 0;
  transition: opacity 0.6s ease;
  cursor: url('/assets/images/key-cursor.png') 16 16, pointer;
  z-index: 3;
}
.scene:hover .lock { opacity: 1; }

/* Subtitle under brain */
.subtitle {
  position: absolute;
  top: 68%;
  width: 100%;
  text-align: center;
  font-size: 1.2rem;
  color: #e0e0e0;
  transition: color 1s ease;
}

/* Happy Mode */
body.happy {
  background: #fff;
  color: #000;
}
body.happy nav {
  background: #fff;
  color: #000;
}
body.happy .projection.gloomy,
body.happy .brain img.gloomy { opacity: 0; }
body.happy .projection.happy,
body.happy .brain img.happy { opacity: 1; }
body.happy .subtitle { color: #000; }
body.happy .lock { display: none; }

</style>
</head>
<body>

<!-- Navbar -->
<nav>
  <div class="brand">HillierLab@HUN-REN TTK + PPKE-IT</div>
  <div>
    <a href="/mission.html">Mission/Vision</a>
    <a href="/research.html">Research</a>
    <a href="/publications.html">Publications & News</a>
    <a href="/open.html">Open Science</a>
  </div>
</nav>

<!-- Scene -->
<div class="scene">
  <img src="/assets/images/big_human.png" class="silhouette" alt="Human silhouette">

  <div class="brain" id="brain">
    <img src="/assets/images/g_brain.png" class="gloomy" alt="Gloomy brain">
    <img src="/assets/images/h_brain.png" class="happy" alt="Happy brain">
  </div>

  <img src="/assets/images/big_lock.png" class="lock" id="lock" alt="Lock">

  <img src="/assets/images/big_scary.png" class="projection gloomy" alt="Scary projection">
  <img src="/assets/images/big_happy.png" class="projection happy" alt="Happy projection">

  <div class="subtitle" id="subtitle">
    Unlocking the Mesoscale Level of the Brain
  </div>
</div>

<script>
const lock = document.getElementById('lock');
const body = document.body;
const subtitle = document.getElementById('subtitle');
const brainGloomy = document.querySelector('.brain img.gloomy');
const brainHappy = document.querySelector('.brain img.happy');
const projGloomy = document.querySelector('.projection.gloomy');
const projHappy = document.querySelector('.projection.happy');
let unlocked = false;

lock.addEventListener('click', e => {
  e.stopPropagation();
  if (unlocked) return;
  unlocked = true;

  body.classList.add('happy');

  // Fade lock out
  lock.style.transition = 'opacity 0.8s ease';
  lock.style.opacity = '0';
  setTimeout(() => { lock.style.display = 'none'; }, 800);

  // Transition images
  brainGloomy.style.opacity = '0';
  projGloomy.style.opacity = '0';
  setTimeout(() => {
    brainHappy.style.opacity = '1';
    projHappy.style.opacity = '1';
  }, 300);

  // Change subtitle
  subtitle.textContent = 'Bridging the Gap Between Molecules and Behavior';
});
</script>
</body>
</html>
